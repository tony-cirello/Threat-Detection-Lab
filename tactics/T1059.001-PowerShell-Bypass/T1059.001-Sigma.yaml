# Custom alert for powershell bypass in Sigma
```yaml
title: Execution Policy Bypass via PowerShell Command Line Arguments
id: 5f1b2c4d-8e9a-4b2c-9a1d-3e5f7a9b0c1d
status: experimental
description: Detects command-line execution of PowerShell where execution policies are explicitly bypassed using execution flags.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.001/T1059.001.md
author: Tony Cirello
date: 2026-11-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_flags:
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - '-ep bypass'
            - '-exec bypass'
            - '-ExecutionPolicy Unrestricted'
            - '-ep unrestrict'
            - '-ExecutionPolicy RemoteSigned'
    filter_intune:
        ParentImage|startswith: 'C:\Program Files\Microsoft Intune Management Extension\'
    condition: (selection_img and selection_flags) and not 1 of filter_*
falsepositives:
    - Legitimate administrative scripts executed by deployment software (Intune, SCCM).
    - Custom internal IT automation tools.
level: medium
